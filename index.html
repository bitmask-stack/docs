<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BitMask Docs</title>
<meta name="description" content="Technical papers and documentation from BitMask.">
<style>
  :root { --ink: #1b1b1f; --muted: #3a3a46; --accent: #3b3394; --paper: #fcfcff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Carlito, Calibri, "Segoe UI", sans-serif; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 24px; }
  .logo { display: block; height: 30px; width: auto; margin: 0 auto 36px; }
  h1 { text-align: center; font-family: "EB Garamond", Garamond, Georgia, serif; font-weight: 400; font-size: clamp(30px, 8vw, 48px); letter-spacing: 0.1em; line-height: 1.1; margin: 0 0 8px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 40px; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--ink); }
  li { border-bottom: 1px solid var(--ink); }
  a { display: block; padding: 18px 4px; color: var(--ink); text-decoration: none; }
  a:hover, a:focus-visible { background: #f0efff; outline: none; }
  .name { font-weight: 700; font-size: 18px; }
  .meta { display: block; font-size: 14px; color: var(--muted); }
  footer { margin-top: 40px; font-size: 13px; color: var(--accent); text-align: center; }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/bitmask-bolt-wordmark.png" alt="BitMask">
  <h1>DOCS</h1>
  <p class="sub">Technical papers and documentation</p>
  <ul>
    <li>
      <a href="UDA/">
        <span class="name">UDA // BTC</span>
        <span class="meta">Atomic Swaps on Bitcoin with RGB 0.11.1. English and 中文</span>
      </a>
    </li>
  </ul>
  <footer>Published by BitMask</footer>
</main>
</body>
</html>
